
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTubeBot V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#f4f5f7;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#171d27;text-align:center;border-bottom:2px solid #ff3333}
header h1{margin:0;font-size:25px}
header p{color:#aeb7c4}
main{max-width:900px;margin:auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#1b2430;padding:18px;border-radius:14px;margin-bottom:15px}
.number{font-size:30px;font-weight:bold;color:#58f5a2}
label{display:block;margin:12px 0 6px}
input{width:100%;padding:13px;border:1px solid #465165;border-radius:8px;background:#111821;color:white}
button{padding:12px 15px;background:#ed3434;color:white;border:0;border-radius:9px;cursor:pointer;margin:5px 4px 5px 0}
button.secondary{background:#344357}
button:disabled{opacity:.5}
.video{border-top:1px solid #354252;padding:15px 0}
.video h3{margin:0 0 10px;overflow-wrap:anywhere}
.small{font-size:13px;color:#aeb7c4}
.progress{background:#303b49;height:9px;border-radius:10px;overflow:hidden;margin:10px 0}
.fill{height:100%;background:#58f5a2}
.notice{color:#ffcf75}
</style>
</head>
<body>
<header>
<h1>🤖 YouTubeBot V2</h1>
<p>Панели моделсозии ботҳо</p>
</header>
<main>
<div class="card">
<p class="notice">Ин версия танҳо озмоишӣ аст. Ба YouTube лайк ё обуна намефиристад.</p>
</div>
<div class="stats">
<div class="card">
<div class="small">Аккаунтҳои виртуалӣ</div>
<div class="number" id="botCount">0</div>
</div>
<div class="card">
<div class="small">Видеоҳо</div>
<div class="number" id="videoCount">0</div>
</div>
<div class="card">
<div class="small">Лайкҳои озмоишӣ</div>
<div class="number" id="totalLikes">0</div>
</div>
<div class="card">
<div class="small">Ҳадафи обуначиҳо</div>
<div class="number">10 000</div>
</div>
</div>
<div class="card">
<h2>Идоракунии ботҳо</h2>
<button onclick="createBots()">Сохтани 10 000 бот</button>
<button class="secondary" onclick="clearAll()">Тоза кардани ҳама</button>
<p id="message" class="small"></p>
</div>
<div class="card">
<h2>Иловаи видео</h2>
<label>Номи видео</label>
<input id="videoTitle" placeholder="Масалан: YouTube Shorts #1" maxlength="150">
<label>Линки видео (ихтиёрӣ)</label>
<input id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
<button onclick="addVideo()">Илова кардан</button>
</div>
<div class="card">
<h2>Видеоҳои озмоишӣ</h2>
<div id="videoList"></div>
</div>
</main>
<script>
const KEY="youtube_bot_v2";
const MAX_BOTS=10000;
let state=load();

function load(){
 try{
  const data=JSON.parse(localStorage.getItem(KEY));
  if(data && Array.isArray(data.videos)){
   return {
    bots:data.bots===MAX_BOTS?MAX_BOTS:0,
    videos:data.videos
   };
  }
 }catch(e){}
 return {bots:0,videos:[]};
}

function save(){
 localStorage.setItem(KEY,JSON.stringify(state));
 render();
}

function createBots(){
 state.bots=MAX_BOTS;
 save();
 message("10 000 аккаунти виртуалӣ омода шуд.");
}

function message(txt){
 document.getElementById("message").textContent=txt;
}

function addVideo(){
 const title=document.getElementById("videoTitle").value.trim();
 const url=document.getElementById("videoUrl").value.trim();
 if(!title){
  alert("Номи видеоро навис.");
  return;
 }
 if(url){
  try{
   const parsed=new URL(url);
   const host=parsed.hostname.toLowerCase();
   if(!["youtube.com","www.youtube.com","m.youtube.com","youtu.be"].includes(host) || parsed.protocol!=="https:"){
    alert("Линки дурусти YouTube гузор.");
    return;
   }
  }catch(e){
   alert("Линки дуруст гузор.");
   return;
  }
 }
 state.videos.push({
  id:crypto.randomUUID(),
  title:title,
  url:url,
  likes:0,
  likedBots:[],
  created:new Date().toLocaleString()
 });
 document.getElementById("videoTitle").value="";
 document.getElementById("videoUrl").value="";
 save();
}

function simulateLikes(id,amount){
 if(state.bots===0){
  alert("Аввал 10 000 ботро соз.");
  return;
 }
 const video=state.videos.find(v=>v.id===id);
 if(!video)return;
 if(!Array.isArray(video.likedBots))video.likedBots=[];
 const used=new Set(video.likedBots);
 const available=[];
 for(let i=1;i<=state.bots;i++){
  if(!used.has(i))available.push(i);
 }
 for(let i=available.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [available[i],available[j]]=[available[j],available[i]];
 }
 const selected=available.slice(0,amount);
 video.likedBots.push(...selected);
 video.likes=video.likedBots.length;
 save();
}

function resetLikes(id){
 const video=state.videos.find(v=>v.id===id);
 if(!video)return;
 video.likes=0;
 video.likedBots=[];
 save();
}

function removeVideo(id){
 if(!confirm("Ин видеоро тоза мекунӣ?"))return;
 state.videos=state.videos.filter(v=>v.id!==id);
 save();
}

function clearAll(){
 if(!confirm("Ҳамаи маълумоти озмоиширо тоза мекунӣ?"))return;
 state={bots:0,videos:[]};
 save();
}

function render(){
 document.getElementById("botCount").textContent=state.bots.toLocaleString();
 document.getElementById("videoCount").textContent=state.videos.length;
 document.getElementById("totalLikes").textContent=
 state.videos.reduce((sum,v)=>sum+(v.likes||0),0).toLocaleString();

 const list=document.getElementById("videoList");
 list.replaceChildren();

 if(!state.videos.length){
  const p=document.createElement("p");
  p.className="small";
  p.textContent="Ҳоло ягон видео илова нашудааст.";
  list.append(p);
  return;
 }

 for(const video of state.videos){
  const box=document.createElement("div");
  box.className="video";
  const h=document.createElement("h3");
  h.textContent=video.title;
  box.append(h);

  const info=document.createElement("p");
  info.textContent="👍 "+(video.likes||0)+" лайки озмоишӣ";
  box.append(info);

  const progress=document.createElement("div");
  progress.className="progress";
  const fill=document.createElement("div");
  fill.className="fill";
  fill.style.width=Math.min(100,(video.likes||0)/300*100)+"%";
  progress.append(fill);
  box.append(progress);

  if(video.url){
   const a=document.createElement("a");
   a.href=video.url;
   a.target="_blank";
   a.rel="noopener noreferrer";
   a.textContent="Кушодани видео дар YouTube";
   a.style.color="#80bfff";
   box.append(a);
  }

  const controls=document.createElement("div");
  const actions=[
   ["+200 лайк",()=>simulateLikes(video.id,200)],
   ["+300 лайк",()=>simulateLikes(video.id,300)],
   ["Аз нав",()=>resetLikes(video.id)],
   ["Нест кардан",()=>removeVideo(video.id)]
  ];
  actions.forEach(([title,fn],index)=>{
   const btn=document.createElement("button");
   btn.textContent=title;
   if(index>1)btn.className="secondary";
   btn.onclick=fn;
   controls.append(btn);
  });
  box.append(controls);
  list.append(box);
 }
}
render();
</script>
</body>
</html>
